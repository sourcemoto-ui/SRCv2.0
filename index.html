        const getLocalDateString = (dateObj) => {
            if (!dateObj || isNaN(new Date(dateObj).getTime())) dateObj = new Date();
            const d = new Date(dateObj);
            return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        };

        const parseDateSafe = (dateVal) => {
            if (!dateVal) return new Date();
            if (dateVal instanceof Date && !isNaN(dateVal.getTime())) return dateVal;
            const s = String(dateVal).trim();
            const d = new Date(s);
            if (!isNaN(d.getTime())) return d;
            const parts = s.split(/[\/\-]/);
            if (parts.length === 3) {
                const y = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10) - 1;
                const day = parseInt(parts[2], 10);
                const dt = new Date(y, m, day);
                if (!isNaN(dt.getTime())) return dt;
            }
            return new Date();
        };

        const evaluateMathExpression = (expr, fallback = 0) => {
            if (expr === null || expr === undefined || expr === '') return fallback;
            if (typeof expr === 'number') return isNaN(expr) ? fallback : expr;
            const s = String(expr).trim();
            if (!s) return fallback;
            if (/^-?\d+(\.\d+)?$/.test(s)) {
                const val = parseFloat(s);
                return isNaN(val) ? fallback : val;
            }
            if (!/^[\d\.\+\-\*\/\(\)\s]+$/.test(s)) {
                return fallback;
            }
            try {
                let clean = s.replace(/[\+\-\*\/]+$/, '').trim();
                if (!clean) return fallback;
                const openCount = (clean.match(/\(/g) || []).length;
                const closeCount = (clean.match(/\)/g) || []).length;
                if (openCount > closeCount) {
                    clean += ')'.repeat(openCount - closeCount);
                }
                const fn = new Function(`'use strict'; return (${clean});`);
                const res = fn();
                if (typeof res === 'number' && !isNaN(res) && isFinite(res)) {
                    return Math.round(res * 100) / 100;
                }
                return fallback;
            } catch (e) {
                return fallback;
            }
        };

        const normalizeItems = (items) => {
            if (!items) return [];
            if (Array.isArray(items)) return items;
            if (typeof items === 'string') {
                const trimmed = items.trim();
                if ((trimmed.startsWith('[') && trimmed.endsWith(']')) || (trimmed.startsWith('{') && trimmed.endsWith('}'))) {
                    try {
                        const parsed = JSON.parse(trimmed);
                        return normalizeItems(parsed);
                    } catch (e) {}
                }
                if (trimmed) {
                    return trimmed.split(/[;\n\r]+/).filter(Boolean).map((name, idx) => ({
                        id: Date.now() + idx,
                        name: name.replace(/^•\s*/, '').trim(),
                        partsPrice: 0,
                        laborHours: 0,
                        qty: 1,
                        itemStatus: 'pending',
                        fulfilled: false,
                        mechanics: {}
                    }));
                }
                return [];
            }
            if (typeof items === 'object') {
                try {
                    return Object.values(items).filter(Boolean);
                } catch (e) {
                    return [];
                }
            }
            return [];
        };

        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 600;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.5));
                    };
                    img.onerror = () => resolve(null);
                };
                reader.onerror = () => resolve(null);
            });
        };

        const copyToClipboard = (text, onSuccess, onFail) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful && onSuccess) onSuccess();
                else if (!successful && onFail) onFail();
            } catch (err) {
                if (onFail) onFail();
            }
            document.body.removeChild(textArea);
        };

        const exportToCsv = (filename, rows) => {
            const processRow = (row) => row.map(val => {
                let str = (val === null || val === undefined) ? '' : String(val);
                str = str.replace(/"/g, '""');
                if (str.search(/("|,|\n)/g) >= 0) str = `"${str}"`;
                return str;
            }).join(",");
            const csvContent = "\uFEFF" + rows.map(processRow).join("\r\n");
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        const safeFetchGAS = async (url, payload, timeoutMs = 25000) => {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                clearTimeout(id);
                if (!res.ok) throw new Error(`HTTP 錯誤: ${res.status}`);
                const data = await res.json();
                return { ok: true, data };
            } catch (err) {
                clearTimeout(id);
                return { ok: false, error: err.name === 'AbortError' ? '連線逾時（伺服器回應逾時，請再次嘗試）' : err.message };

        const NewOrderForm = ({ draftOrder, setDraftOrder, customers, records, quickServices, staffList, shopInfo, handleCreateOrder, setView, showAlert, showConfirm, isUploadingOrder, editingOrderId, setEditingOrderId, isUnlocked, requestAdminAuth }) => {
            const [lastServiceHint, setLastServiceHint] = useState(null);
            const [lastMileageRecord, setLastMileageRecord] = useState(null);
            const [predictedDailyKm, setPredictedDailyKm] = useState(null);
            const fileInputRef1 = useRef(null);
            const fileInputRef2 = useRef(null);

            const hourlyRate = Number(shopInfo.hourlyRate || 800);

            const updateDraft = (field, value) => { setDraftOrder(prev => ({ ...prev, [field]: value })); };
            const updateInspection = (field, value) => {
                setDraftOrder(prev => ({
                    ...prev,
                    inspection: {
                        ...(prev.inspection || INITIAL_INSPECTION),
                        [field]: value
                    }
                }));
            };

            useEffect(() => {
                if (draftOrder.plate && draftOrder.plate.length >= 3) {
                    const safePlate = String(draftOrder.plate).toUpperCase();
                    const exist = customers.find(c => c && c.plate && String(c.plate).toUpperCase() === safePlate);
                    
                    if (exist) {
                        setDraftOrder(prev => {
                            if (!prev.name) return { ...prev, name: exist.name || '', phone: exist.phone || '', email: exist.email || '', year: exist.year || '', bikeModel: exist.bikeModel || '' };
                            return prev;
                        });
                        setLastMileageRecord(exist.lastMileage);
                    }

                    const carRecords = records.filter(r => r.plate && String(r.plate).toUpperCase() === safePlate && r.status === 'completed').sort((a, b) => parseDateSafe(b.timestamp || b.date) - parseDateSafe(a.timestamp || a.date));
                    
                    if (carRecords.length > 0) {
                        const lastRec = carRecords[0];
                        const lastItems = normalizeItems(lastRec.items);
                        const itemsStr = lastItems.length > 0 ? lastItems.map(i => i.name).join('、') : '無明細';
                        setLastServiceHint({ date: formatDate(lastRec.date), items: itemsStr, mileage: lastRec.mileage });

                        if (carRecords.length >= 2 && lastRec.mileage && carRecords[1].mileage) {
                            const d1 = parseDateSafe(lastRec.timestamp || lastRec.date);
                            const d2 = parseDateSafe(carRecords[1].timestamp || carRecords[1].date);
                            const diffDays = Math.max(1, Math.round((d1 - d2) / (1000 * 60 * 60 * 24)));
                            const diffKm = Number(lastRec.mileage) - Number(carRecords[1].mileage);
                            if (diffKm > 0 && diffDays > 0) {
                                setPredictedDailyKm(diffKm / diffDays);
                            } else {
                                setPredictedDailyKm(null);
                            }
                        } else {
                            setPredictedDailyKm(null);
                        }
                    } else { 
                        setLastServiceHint(null); 
                        setPredictedDailyKm(null);
                    }
                } else { 
                    setLastServiceHint(null); 
                    setPredictedDailyKm(null);
                }
            }, [draftOrder.plate, customers, records]);

            useEffect(() => { 
                if (draftOrder.mileage && !isNaN(Number(draftOrder.mileage))) {
                    const nextKm = Number(draftOrder.mileage) + 2500;
                    updateDraft('nextMileage', nextKm);

                    const daily = (predictedDailyKm && predictedDailyKm > 5 && predictedDailyKm < 200) ? predictedDailyKm : 25;
                    const daysNeeded = Math.round(2500 / daily);
                    const futureDate = new Date();
                    futureDate.setDate(futureDate.getDate() + daysNeeded);
                    updateDraft('nextServiceDate', getLocalDateString(futureDate));
                }
            }, [draftOrder.mileage, predictedDailyKm]);

            const handlePhotoChange = async (e, photoKey) => {
                const file = e.target.files[0];
                if (file) { 
                    const compressed = await compressImage(file); 
                    updateDraft(photoKey, compressed); 
                }
            };

            const addItem = () => { updateDraft('items', [...draftOrder.items, { id: Date.now(), name: '', partsPrice: 0, laborHours: 0, qty: 1, itemStatus: 'pending', fulfilled: false, mechanics: {}, isBasicMaintenance: true }]); };
            const removeItem = (id) => { if (draftOrder.items.length > 1) updateDraft('items', draftOrder.items.filter(i => i.id !== id)); };
            const updateItem = (id, field, value) => { updateDraft('items', draftOrder.items.map(i => i.id === id ? { ...i, [field]: value } : i)); };

            const toggleItemMechanic = (id, staffName) => {
                updateDraft('items', draftOrder.items.map(i => {
                    if (i.id === id) return { ...i, mechanics: { ...i.mechanics, [staffName]: !i.mechanics[staffName] } };
                    return i;
                }));
            };

            const handleToggleCommission = (item) => {
                const cur = item.isBasicMaintenance !== undefined ? item.isBasicMaintenance : true;
                if (cur) {
                    // 目前為「免抽成」，欲切換為「計抽成」
                    if (isUnlocked) {
                        // 老闆模式：直接切換，無需重複輸入密碼
                        updateItem(item.id, 'isBasicMaintenance', false);
                    } else {
                        // 員工模式：需輸入主管授權 PIN 碼驗證一次，通過後即進入老闆模式
                        requestAdminAuth(() => {
                            updateItem(item.id, 'isBasicMaintenance', false);
                        });
                    }
                } else {
                    // 目前為「計抽成」，切換回「免抽成」可直接變更
                    updateItem(item.id, 'isBasicMaintenance', true);
                }
            };

            const handleToggleCommissionParts = (checked) => {
                if (checked) {
                    if (isUnlocked) {
                        // 老闆模式：直接開啟，不重複輸入
                        updateDraft('commissionParts', true);
                    } else {
                        // 員工模式：需主管授權 PIN 碼
                        requestAdminAuth(() => {
                            updateDraft('commissionParts', true);
                        });
                    }
                } else {
                    updateDraft('commissionParts', false);
                }
            };

            const commissionRate = Number(shopInfo.referrerCommissionRate !== undefined ? shopInfo.referrerCommissionRate : 20);
            const getItemTotal = (item) => (evaluateMathExpression(item.partsPrice, 0) + (evaluateMathExpression(item.laborHours, 0) * hourlyRate)) * Number(item.qty || 1);
            const total = draftOrder.items.reduce((sum, item) => sum + getItemTotal(item), 0);
            const totalPartsFee = draftOrder.items.reduce((sum, item) => sum + (evaluateMathExpression(item.partsPrice, 0) * Number(item.qty || 1)), 0);

            const eligiblePartsFee = draftOrder.items.reduce((sum, item) => {
                const isBasic = item.isBasicMaintenance !== undefined ? item.isBasicMaintenance : true;
                if (isBasic) return sum;
                return sum + (evaluateMathExpression(item.partsPrice, 0) * Number(item.qty || 1));
            }, 0);
            const basicMaintenancePartsFee = totalPartsFee - eligiblePartsFee;
            const referrerPartsCommission = (draftOrder.referrerStaff && draftOrder.commissionParts) ? Math.round(eligiblePartsFee * (commissionRate / 100)) : 0;
            const depositAmount = draftOrder.hasDeposit ? Math.min(total, evaluateMathExpression(draftOrder.depositAmount, 0)) : 0;
            const remainingBalance = Math.max(0, total - depositAmount);

            const handleSaveAction = (targetStatus, stageOverride = null) => {
                if (!draftOrder.plate) return showAlert('請輸入車牌號碼');
                if (isUploadingOrder) return;

                const finalStage = stageOverride || draftOrder.progressStage || (targetStatus === 'completed' ? '已完工' : '維修中');

                const evaluatedItems = draftOrder.items.map(it => ({
                    ...it,
                    partsPrice: evaluateMathExpression(it.partsPrice, 0),
                    laborHours: evaluateMathExpression(it.laborHours, 0),
                    isBasicMaintenance: it.isBasicMaintenance !== undefined ? it.isBasicMaintenance : true
                }));

                const orderPayload = {
                    ...draftOrder,
                    items: evaluatedItems,
                    hourlyRate,
                    plate: String(draftOrder.plate).toUpperCase(),
                    total,
                    depositAmount,
                    remainingBalance,
                    referrerStaff: draftOrder.referrerStaff || '',
                    commissionParts: Boolean(draftOrder.commissionParts),
                    referrerCommissionRate: commissionRate,
                    eligiblePartsFee,
                    referrerPartsCommission,
                    depositDate: (draftOrder.hasDeposit && !draftOrder.depositDate) ? getLocalDateString(new Date()) : draftOrder.depositDate,
                    status: targetStatus,
                    progressStage: finalStage,
                    isCompleted: targetStatus === 'completed'
                };

                handleCreateOrder(orderPayload, editingOrderId);
            };

            const quickAdd = (service) => {
                const executeAdd = () => {
                    setDraftOrder(prev => {
                        const emptyIndex = prev.items.findIndex(i => i.name === '');
                        const pVal = service.partsPrice !== undefined ? service.partsPrice : service.price || 0;
                        const isBasic = service.isBasicMaintenance !== undefined ? service.isBasicMaintenance : true;
                        if (emptyIndex !== -1) {
                            const newItems = [...prev.items];
                            newItems[emptyIndex] = { ...newItems[emptyIndex], name: service.name, partsPrice: pVal, laborHours: service.laborHours || 0, itemStatus: 'pending', fulfilled: false, isBasicMaintenance: isBasic };
                            return { ...prev, items: newItems };
                        } else {
                            return { ...prev, items: [...prev.items, { id: Date.now(), name: service.name, partsPrice: pVal, laborHours: service.laborHours || 0, qty: 1, itemStatus: 'pending', fulfilled: false, mechanics: {}, isBasicMaintenance: isBasic }] };
                        }
                    });
                };
                if (service.stock !== undefined && service.stock <= 0) {
                    showConfirm(`${service.name} 目前庫存為 0，確定要加入維修清單嗎？`, executeAdd);
                } else {
                    executeAdd();
                }
            };

            const inspectionData = draftOrder.inspection || INITIAL_INSPECTION;

            return (
                <div className="max-w-4xl mx-auto bg-white md:rounded-2xl shadow-sm border border-slate-200 h-full flex flex-col">
                    <div className="bg-slate-50 p-4 border-b border-slate-200 flex flex-wrap justify-between items-center sticky top-0 z-20 md:rounded-t-2xl gap-2">
                        <div className="flex items-center gap-2">
                            <Plus size={20} className="text-blue-600" />
                            <h2 className="text-base sm:text-lg font-black text-slate-800">

                                >

                                    type="button" 
                                    onClick={() => handleSaveAction('in_progress', '維修中')} 
                                    disabled={isUploadingOrder}

                                >
                                    <Wrench size={14}/> <span>存為維修中</span>

                                    onClick={() => handleSaveAction('completed', '已完工')} 
                                    disabled={isUploadingOrder} 
                                    className="py-1.5 px-1 rounded-xl font-black text-[11px] sm:text-xs text-white bg-blue-600 hover:bg-blue-700 shadow-sm shadow-blue-200 flex items-center justify-center gap-1 active:scale-95 transition-all disabled:opacity-50"
                                >
                                    {isUploadingOrder ? <RefreshCw size={14} className="animate-spin" /> : <CheckSquare size={14} />}

                            </div>

                </div>

        };

        const Dashboard = ({ records, deleteRecord, setSelectedRecord, setShowReceiptModal, setDraftOrder, setEditingOrderId, setView, handleStatusChange, handleUpdateOrderStage, handleUpdateOrderField, showConfirm, isUnlocked, requestAdminAuth }) => {
            const [activeTab, setActiveTab] = useState('waiting-parts');
            const [searchTerm, setSearchTerm] = useState('');
            const [inProgressFilter, setInProgressFilter] = useState('all');

            const currentYear = new Date().getFullYear();
            const [startYear, setStartYear] = useState(currentYear);
            const [startMonth, setStartMonth] = useState(1);
            const [endYear, setEndYear] = useState(currentYear);
            const [endMonth, setEndMonth] = useState(12);

            const handleSwitchToCompletedTab = () => {
                if (isUnlocked) {
                    setActiveTab('completed');
                } else if (requestAdminAuth) {
                    requestAdminAuth(() => setActiveTab('completed'));
                } else {
                    setActiveTab('completed');
                }
            };

            const waitingPartsRecords = useMemo(() => {
                return records.filter(r => (r.status === 'in_progress' || !r.status) && r.progressStage === '等待備料').filter(r => {
                    if (!searchTerm) return true;
                    const q = searchTerm.toUpperCase();
                    return (r.plate && r.plate.includes(q)) || (r.name && r.name.includes(q));
                });
            }, [records, searchTerm]);

            const inProgressRecords = useMemo(() => {
                return records.filter(r => (r.status === 'in_progress' || !r.status) && r.progressStage !== '等待備料').filter(r => {
                    if (inProgressFilter !== 'all' && r.progressStage !== inProgressFilter) return false;
                    if (!searchTerm) return true;
                    const q = searchTerm.toUpperCase();
                    return (r.plate && r.plate.includes(q)) || (r.name && r.name.includes(q));
                });
            }, [records, searchTerm, inProgressFilter]);

            const { filteredCompletedRecords, totalCompletedRevenue, cashRevenue, transferRevenue, avgOrderPrice } = useMemo(() => {
                const startDt = new Date(startYear, startMonth - 1, 1).getTime();
                const endDt = new Date(endYear, endMonth, 0, 23, 59, 59).getTime();

                const filtered = records.filter(r => r.status === 'completed').filter(r => {
                    const rDate = parseDateSafe(r.timestamp || r.date).getTime();
                    const inRange = rDate >= startDt && rDate <= endDt;
                    if (!inRange) return false;
                    if (!searchTerm) return true;
                    const q = searchTerm.toUpperCase();
                    return (r.plate && r.plate.includes(q)) || (r.name && r.name.includes(q));
                });

                let totalRev = 0;
                let cashRev = 0;
                let transRev = 0;

                filtered.forEach(r => {
                    const tot = Number(r.total || 0);
                    totalRev += tot;
                    if (r.paymentMethod === '現金') cashRev += tot;
                    else if (r.paymentMethod === '匯款') transRev += tot;
                });

                const avg = filtered.length > 0 ? Math.round(totalRev / filtered.length) : 0;

                return {
                    filteredCompletedRecords: filtered,
                    totalCompletedRevenue: totalRev,
                    cashRevenue: cashRev,
                    transferRevenue: transRev,
                    avgOrderPrice: avg
                };
            }, [records, startYear, startMonth, endYear, endMonth, searchTerm]);

            const handleQuickRange = (rangeType) => {
                const now = new Date();
                const cy = now.getFullYear();
                const cm = now.getMonth() + 1;
                if (rangeType === 'thisYear') {
                    setStartYear(cy); setStartMonth(1);
                    setEndYear(cy); setEndMonth(12);
                } else if (rangeType === 'last3Months') {
                    const past = new Date(now.getFullYear(), now.getMonth() - 2, 1);
                    setStartYear(past.getFullYear()); setStartMonth(past.getMonth() + 1);
                    setEndYear(cy); setEndMonth(cm);
                } else if (rangeType === 'last6Months') {
                    const past = new Date(now.getFullYear(), now.getMonth() - 5, 1);
                    setStartYear(past.getFullYear()); setStartMonth(past.getMonth() + 1);
                    setEndYear(cy); setEndMonth(cm);
                } else if (rangeType === 'all') {
                    setStartYear(2023); setStartMonth(1);
                    setEndYear(cy + 1); setEndMonth(12);
                }
            };

            const handleExportCompletedCsv = () => {
                const rows = [
                    ['工單編號', '日期', '車牌', '車主姓名', '電話', '車種', '里程(km)', '施工明細', '已付定金', '尾款', '總額', '收款方式', '介紹人技師']
                ];
                filteredCompletedRecords.forEach(r => {
                    const items = normalizeItems(r.items);
                    const itemsStr = items.map(it => `${it.name} x${it.qty || 1}`).join('; ');
                    rows.push([
                        r.id || '',
                        formatDate(r.date),
                        r.plate || '',
                        r.name || '',
                        r.phone || '',
                        r.bikeModel || '',
                        r.mileage || '',
                        itemsStr,
                        r.depositAmount || 0,
                        r.remainingBalance || 0,
                        r.total || 0,
                        r.paymentMethod || '現金',
                        r.referrerStaff || '無'
                    ]);
                });
                exportToCsv(`完工營收明細表_${startYear}_${startMonth}至${endYear}_${endMonth}.csv`, rows);
            };

            const handleEditOrder = (r) => {
                setDraftOrder({
                    ...INITIAL_ORDER_STATE,
                    ...r,
                    items: normalizeItems(r.items),
                    inspection: r.inspection || INITIAL_INSPECTION
                });
                setEditingOrderId(r.id);
                setView('new-order');
            };

            const handleItemCheckboxInCard = (record, itemId) => {
                const items = normalizeItems(record.items);
                const updatedItems = items.map(it => {
                    if (it.id === itemId) {
                        const currentStatus = getItemStatus(it);
                        const next = currentStatus === 'fulfilled' ? 'pending' : 'fulfilled';
                        return { ...it, itemStatus: next, fulfilled: next === 'fulfilled' };
                    }
                    return it;
                });
                handleUpdateOrderField(record.id, { items: updatedItems });
            };

            return (
                <div className="space-y-5 max-w-7xl mx-auto pb-24 text-xs">
                    {/* Top stats overview cards */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5 sm:gap-4">
                        <div onClick={() => setActiveTab('waiting-parts')} className="bg-white p-3.5 sm:p-4 rounded-2xl border border-orange-200 shadow-2xs hover:border-orange-400 cursor-pointer transition-colors">
                            <div className="flex justify-between items-center text-slate-500 font-bold">
                                <span>等待備料中</span>
                                <Package className="text-orange-500" size={18} />
                            </div>
                            <div className="text-2xl font-black text-orange-600 font-mono mt-1">
                                {records.filter(r => (r.status === 'in_progress' || !r.status) && r.progressStage === '等待備料').length} <span className="text-xs font-bold text-slate-400">台</span>
                            </div>
                        </div>

                        <div onClick={() => setActiveTab('in-progress')} className="bg-white p-3.5 sm:p-4 rounded-2xl border border-blue-200 shadow-2xs hover:border-blue-400 cursor-pointer transition-colors">
                            <div className="flex justify-between items-center text-slate-500 font-bold">
                                <span>現場維修中</span>
                                <Wrench className="text-blue-600" size={18} />
                            </div>
                            <div className="text-2xl font-black text-blue-600 font-mono mt-1">
                                {records.filter(r => (r.status === 'in_progress' || !r.status) && r.progressStage !== '等待備料').length} <span className="text-xs font-bold text-slate-400">台</span>
                            </div>
                        </div>

                        <div onClick={handleSwitchToCompletedTab} className="bg-white p-3.5 sm:p-4 rounded-2xl border border-emerald-200 shadow-2xs hover:border-emerald-400 cursor-pointer transition-colors">
                            <div className="flex justify-between items-center text-slate-500 font-bold">
                                <span className="flex items-center gap-1">區間完工結算 {!isUnlocked && <Lock size={12} className="text-amber-500"/>}</span>
                                <CheckSquare className="text-emerald-600" size={18} />
                            </div>
                            <div className="text-2xl font-black text-emerald-600 font-mono mt-1">
                                {filteredCompletedRecords.length} <span className="text-xs font-bold text-slate-400">單</span>
                            </div>
                        </div>

                        <div onClick={handleSwitchToCompletedTab} className="bg-gradient-to-br from-slate-900 to-blue-950 p-3.5 sm:p-4 rounded-2xl text-white shadow-xs cursor-pointer">
                            <div className="flex justify-between items-center text-slate-300 font-bold">
                                <span className="flex items-center gap-1">區間營收總額 {!isUnlocked && <Lock size={12} className="text-amber-400"/>}</span>
                                <Coins className="text-amber-400" size={18} />
                            </div>
                            <div className="text-xl sm:text-2xl font-black text-amber-400 font-mono mt-1">
                                ${totalCompletedRevenue.toLocaleString()}
                            </div>
                        </div>
                    </div>

                    {/* Main Tab Navigation */}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-3 rounded-2xl border border-slate-200 shadow-xs">
                        <div className="flex bg-slate-100 p-1 rounded-xl w-full sm:w-auto">
                            <button 
                                onClick={() => setActiveTab('waiting-parts')} 
                                className={`flex-1 sm:flex-none px-4 py-2 rounded-lg font-bold transition-all flex items-center justify-center gap-1.5 ${activeTab === 'waiting-parts' ? 'bg-orange-500 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                <Package size={16}/> <span>等待備料 ({waitingPartsRecords.length})</span>
                            </button>
                            <button 
                                onClick={() => setActiveTab('in-progress')} 
                                className={`flex-1 sm:flex-none px-4 py-2 rounded-lg font-bold transition-all flex items-center justify-center gap-1.5 ${activeTab === 'in-progress' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                <Wrench size={16}/> <span>維修處理中 ({inProgressRecords.length})</span>
                            </button>
                            <button 
                                onClick={handleSwitchToCompletedTab} 
                                className={`flex-1 sm:flex-none px-4 py-2 rounded-lg font-bold transition-all flex items-center justify-center gap-1.5 ${activeTab === 'completed' ? 'bg-slate-800 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                <History size={16}/> <span>已完工歷史紀錄 & 結算</span>
                                {!isUnlocked && <span className="text-[10px] bg-amber-500/20 text-amber-300 px-1 py-0.5 rounded font-bold flex items-center gap-0.5 ml-1"><Lock size={10}/> 密碼</span>}
                            </button>
                        </div>
                        <div className="relative w-full sm:w-64">
                            <Search className="absolute left-3 top-2.5 text-slate-400" size={15}/>

                                  text.match(/(勁戰[\d代]*|SMAX|FORCE[\s\d]*|DRG[\s\d]*|MMBCU|KRV|AUGUR|JET[\sSLSR+]*|CYGNUS|JOG|MANY|BWS|R15|MT-?\d+|CB\d+|雷霆[\sS]*|新勁戰)/i);
                if (bikeMatch) parsedBike = bikeMatch[0].replace(/^(?:車種|車型|型號)[：:\s]*/i, '').trim();

                const lines = text.split(/[\n\r,，;；]+/);

                    if (n.length >= 2) extracted.push({ id: Date.now() + Math.random(), name: n, partsPrice: p, laborHours: l, qty: q });

${JSON.stringify(catalogSummary)}

分析與判斷規則：
1. 車牌識別：標準台灣車牌格式 (例如 ABC-1234, 123-ABC, 1234-AB 等)。
2. 車主與車種識別：若出現稱呼（如陳先生、林哥）或特定車種名稱（勁戰、DRG、MMBCU、SMAX 等）請提取。

4. 必須嚴格輸出符合指定 JSON Schema 的結構化資料。`;

                                        <input type="text" placeholder="零件費" value={it.partsPrice} onChange={e => updateQuoteItem(it.id, 'partsPrice', e.target.value)} className="w-24 p-1.5 border border-slate-300 rounded-lg bg-white outline-none font-mono text-right"/>

                                        <input type="number" min="1" value={it.qty} onChange={e => updateQuoteItem(it.id, 'qty', Number(e.target.value))} className="w-12 p-1.5 border border-slate-300 rounded-lg bg-white outline-none text-center font-bold"/>

                                    <span className="text-slate-400 text-xs block">預估報價總額</span>
                                    <span className="text-2xl font-black text-blue-700 font-mono">${Math.round(quoteTotal).toLocaleString()}</span>
                                </div>
                                <div className="flex gap-2 w-full sm:w-auto">
                                    <button onClick={handleCopyQuoteToLine} className="flex-1 sm:flex-none px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 shadow-xs">
                                        <ShareNetwork size={16}/> 傳送至 LINE 報價
                                    </button>
                                    <button onClick={handleConvertToOrder} className="flex-1 sm:flex-none px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 shadow-xs">

                    <PurchaseOrderModal
