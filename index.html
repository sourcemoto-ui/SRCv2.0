                        onClose={() => setShowPOModal(false)} 
                        quickServices={quickServices} 
                        shopInfo={shopInfo} 
                    />
                </div>
            );
        };

        const RemindersView = ({ customers, setCustomers, records, shopInfo, gasUrl, isCloudEnabled, showAlert }) => {
            const [filterTab, setFilterTab] = useState('oil');
            const [sendingId, setSendingId] = useState(null);
            const [emailModal, setEmailModal] = useState({
                isOpen: false,
                customer: null,
                email: '',
                subject: '',
                content: ''
            });

            const now = new Date().getTime();

            const reminderList = useMemo(() => {
                return customers.map(c => {
                    const lastRecs = records.filter(r => r.plate && String(r.plate).toUpperCase() === String(c.plate).toUpperCase() && r.status === 'completed').sort((a, b) => parseDateSafe(b.timestamp || b.date) - parseDateSafe(a.timestamp || a.date));
                    const lastRec = lastRecs[0];
                    const lastDate = lastRec ? parseDateSafe(lastRec.timestamp || lastRec.date) : parseDateSafe(c.lastVisit);
                    const daysSince = Math.round((now - lastDate.getTime()) / (1000 * 60 * 60 * 24));
                    return {
                        ...c,
                        lastVisitFormatted: formatDate(lastDate),
                        daysSince,
                        lastMileage: lastRec ? lastRec.mileage : c.lastMileage
                    };
                }).filter(c => {
                    if (filterTab === 'oil') return c.daysSince >= 180;
                    if (filterTab === 'major') return c.daysSince >= 365;
                    return true;
                }).sort((a, b) => b.daysSince - a.daysSince);
            }, [customers, records, filterTab]);

            const openEmailModal = (c) => {
                const subject = `【${shopInfo.name || '車行'}】定期愛車保養與安全檢查貼心提醒 - ${c.plate}`;
                const defaultContent = `親愛的 ${c.name || '車主'} 您好：\n\n`
                    + `感謝您一直以來對【${shopInfo.name || '車行'}】的信任與支持！\n\n`
                    + `系統貼心提醒您，您的愛車（車牌號碼：${c.plate}${c.bikeModel ? `，車種：${c.bikeModel}` : ''}）：\n`
                    + `上次進廠維護日期為 ${c.lastVisitFormatted}（距今已過 ${c.daysSince} 天${c.lastMileage ? `，當時里程約 ${c.lastMileage} km` : ''}）。\n\n`
                    + `為了確保您的行車安全並維持車輛最佳運轉性能，建議您近期撥空回廠進行定檢與保養項目：\n`
                    + `  • 機油、齒輪油潤滑度檢測與更換\n`
                    + `  • 輪胎胎紋深度與胎壓安全檢查\n`
                    + `  • 煞車皮來令片磨耗厚度檢視\n`
                    + `  • 電瓶電壓蓄電健康度測試\n\n`
                    + `若有任何車況疑問或欲預約保養時間，歡迎隨時來電洽詢！\n\n`
                    + `門市名稱：${shopInfo.name || '車行'}\n`
                    + `預約電話：${shopInfo.phone || '未提供'}\n`
                    + `門市地址：${shopInfo.address || '未提供'}\n\n`
                    + `祝您 騎乘順暢、行車平安！`;

                setEmailModal({
                    isOpen: true,
                    customer: c,
                    email: c.email || '',
                    subject,
                    content: defaultContent
                });
            };

            const handleSendEmail = async () => {
                const { customer, email, subject, content } = emailModal;
                if (!email || !email.trim() || !email.includes('@')) {
                    showAlert('請輸入有效的電子信箱（Email 地址）！');
                    return;
                }

                setSendingId(customer.id || customer.plate);
                try {
                    const res = await safeFetchGAS(gasUrl, {
                        action: 'send_maintenance_reminder',
                        email: email.trim(),
                        subject: subject.trim(),
                        customText: content,
                        shopInfo
                    }, 25000);

                    if (res.ok && res.data && res.data.status === 'success') {
                        // 若客戶原本未填寫 Email 或 Email 有變更，更新客戶資料庫
                        if (setCustomers && customer.email !== email.trim()) {
                            setCustomers(prev => prev.map(item => {
                                if ((item.id && item.id === customer.id) || item.plate === customer.plate) {
                                    return { ...item, email: email.trim() };
                                }
                                return item;
                            }));
                        }
                        showAlert(`保養提醒 Email 已成功寄送給車主（${email.trim()}）！`);
                        setEmailModal({ isOpen: false, customer: null, email: '', subject: '', content: '' });
                    } else {
                        showAlert(`發送失敗：${res.error || (res.data && res.data.message) || '伺服器未正確回應'}`);
                    }
                } catch (err) {
                    showAlert(`發送發生錯誤：${err.message || '請確認網路與 Google Apps Script 連線'}`);
                } finally {
                    setSendingId(null);
                }
            };

            return (
                <div className="max-w-5xl mx-auto space-y-4 pb-24 text-xs">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <div>
                            <h2 className="text-lg font-black text-slate-800 flex items-center gap-2">
                                <Mail className="text-blue-600" size={22}/> 定期保養回廠 Email 貼心提醒
                            </h2>
                            <p className="text-slate-400 text-xs mt-0.5">自動追蹤已過保養週期之車輛，一鍵寄送預約與安全定檢 Email</p>
                        </div>
                        <div className="flex bg-slate-100 p-1 rounded-xl">
                            <button onClick={() => setFilterTab('oil')} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${filterTab === 'oil' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600'}`}>機油保養 (半年)</button>
                            <button onClick={() => setFilterTab('major')} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${filterTab === 'major' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600'}`}>年度大保養 (1年)</button>
                            <button onClick={() => setFilterTab('all')} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${filterTab === 'all' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600'}`}>全部客戶</button>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                        <table className="w-full text-left text-xs min-w-[700px]">
                            <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold">
                                    <th className="p-3.5">車牌號碼</th>
                                    <th className="p-3.5">車主姓名</th>
                                    <th className="p-3.5">電子郵件 / 電話</th>
                                    <th className="p-3.5">上次到店日期</th>
                                    <th className="p-3.5 text-center">已過天數</th>
                                    <th className="p-3.5 text-center w-36">Email 推播操作</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {reminderList.map(c => {
                                    const hasEmail = Boolean(c.email && c.email.trim());
                                    const isSendingThis = sendingId === (c.id || c.plate);

                                    return (
                                        <tr key={c.id || c.plate} className="hover:bg-slate-50/80 transition-colors">
                                            <td className="p-3.5 font-mono font-black text-blue-700 text-sm">{c.plate}</td>
                                            <td className="p-3.5 font-bold text-slate-800">{c.name || '車主'}</td>
                                            <td className="p-3.5">
                                                {hasEmail ? (
                                                    <div className="font-mono text-slate-700 font-bold flex items-center gap-1">
                                                        <Mail size={12} className="text-blue-500" /> {c.email}
                                                    </div>
                                                ) : (
                                                    <span className="text-amber-600 text-[11px] font-bold bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                                                        尚未登記 Email
                                                    </span>
                                                )}
                                                {c.phone && <div className="font-mono text-slate-400 text-[11px] mt-0.5">{c.phone}</div>}
                                            </td>
                                            <td className="p-3.5 text-slate-600">{c.lastVisitFormatted}</td>
                                            <td className="p-3.5 text-center">
                                                <span className={`px-2 py-0.5 rounded-full font-bold ${c.daysSince > 180 ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-600'}`}>
                                                    {c.daysSince} 天
                                                </span>
                                            </td>
                                            <td className="p-3.5 text-center">
                                                <button 
                                                    onClick={() => openEmailModal(c)} 
                                                    disabled={isSendingThis}
                                                    className={`px-3 py-1.5 rounded-lg font-bold flex items-center justify-center gap-1 mx-auto shadow-xs transition-colors ${
                                                        hasEmail 
                                                            ? 'bg-blue-600 hover:bg-blue-700 text-white' 
                                                            : 'bg-amber-500 hover:bg-amber-600 text-white'
                                                    } disabled:opacity-50`}
                                                    title={hasEmail ? '點擊編輯並發送 Email' : '車主無 Email，點擊補填後發送'}
                                                >
                                                    {isSendingThis ? <RefreshCw size={13}/> : <Mail size={13}/>}
                                                    <span>{hasEmail ? '發送 Email' : '補填 Email 寄送'}</span>
                                                </button>
                                            </td>
                                        </tr>
                                    );
                                })}
                                {reminderList.length === 0 && (
                                    <tr>
                                        <td colSpan="6" className="p-12 text-center text-slate-400 font-bold">目前無符合條件的待提醒車輛</td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>

                    {/* Email 預覽與自訂寄送彈窗 */}
                    {emailModal.isOpen && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-[9999] p-4">
                            <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden animate-in zoom-in-95">
                                <div className="bg-slate-900 text-white p-4 flex justify-between items-center">
                                    <div className="flex items-center gap-2 font-bold text-sm">
                                        <Mail size={18} className="text-blue-400"/>
                                        <span>發送保養提醒 Email（{emailModal.customer?.plate}）</span>
                                    </div>
                                    <button 
                                        onClick={() => setEmailModal({ ...emailModal, isOpen: false })} 
                                        className="p-1 hover:bg-slate-800 rounded-lg text-slate-300"
                                    >
                                        <X size={18}/>
                                    </button>
                                </div>
                                <div className="p-5 overflow-y-auto flex-1 space-y-3.5 text-xs">
                                    <div>
                                        <label className="text-xs font-bold text-slate-700 block mb-1">
                                            收件者信箱 (Email) *
                                        </label>
                                        <input 
                                            type="email" 
                                            value={emailModal.email}
                                            onChange={e => setEmailModal({ ...emailModal, email: e.target.value })}
                                            placeholder="例如：customer@example.com"
                                            className="w-full p-2.5 border border-slate-300 rounded-xl font-bold bg-slate-50 outline-none focus:border-blue-500 font-mono"
                                        />
                                        {!emailModal.customer?.email && (
                                            <span className="text-[11px] text-amber-600 font-bold mt-1 block">
                                                💡 寄出後將自動將此 Email 保存至該客戶車籍檔案中，下次無需重複輸入。
                                            </span>
                                        )}
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-700 block mb-1">信件主旨</label>
                                        <input 
                                            type="text" 
                                            value={emailModal.subject}
                                            onChange={e => setEmailModal({ ...emailModal, subject: e.target.value })}
                                            className="w-full p-2.5 border border-slate-300 rounded-xl font-bold bg-slate-50 outline-none focus:border-blue-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-700 block mb-1">信件內容預覽與自訂編輯</label>
                                        <textarea 
                                            rows="10"
                                            value={emailModal.content}
                                            onChange={e => setEmailModal({ ...emailModal, content: e.target.value })}
                                            className="w-full p-3 border border-slate-300 rounded-xl leading-relaxed outline-none focus:border-blue-500 bg-slate-50 font-mono text-[11px]"
                                        ></textarea>
                                    </div>
                                </div>
                                <div className="p-3.5 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
                                    <button 
                                        type="button" 
                                        onClick={() => setEmailModal({ ...emailModal, isOpen: false })}
                                        className="px-4 py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-xl font-bold transition-colors"
                                    >
                                        取消
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={handleSendEmail}
                                        disabled={sendingId !== null}
                                        className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold flex items-center gap-1.5 shadow-xs transition-colors disabled:opacity-50"
                                    >
                                        {sendingId !== null ? <RefreshCw size={14}/> : <Check size={14}/>}
                                        <span>{sendingId !== null ? '正在寄送中...' : '確認寄出 Email'}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CustomersView = ({ customers, records }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCustomer, setSelectedCustomer] = useState(null);

            const filtered = customers.filter(c => {
                if (!searchTerm) return true;
                const q = searchTerm.toUpperCase();
                return (c.plate && c.plate.includes(q)) || (c.name && c.name.includes(q)) || (c.phone && c.phone.includes(q));
            });

            return (
                <div className="max-w-6xl mx-auto space-y-4 pb-24 text-xs">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <div>
                            <h2 className="text-lg font-black text-slate-800 flex items-center gap-2">
                                <Users className="text-blue-600" size={22}/> 客戶車籍資料庫
                            </h2>
                            <p className="text-slate-400 text-xs mt-0.5">全店累計 {customers.length} 位客戶與機車維修履歷檔案</p>
                        </div>
                        <div className="relative w-full sm:w-64">
                            <Search className="absolute left-3 top-2.5 text-slate-400" size={15}/>
                            <input 
                                type="text" 
                                placeholder="搜尋車牌、姓名或電話..." 
                                value={searchTerm} 
                                onChange={e => setSearchTerm(e.target.value)} 
                                className="w-full pl-9 pr-3 py-1.5 border border-slate-300 rounded-xl outline-none focus:border-blue-500 bg-slate-50"
                            />
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                        <table className="w-full text-left text-xs min-w-[700px]">
                            <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold">
                                    <th className="p-3.5">車牌</th>
                                    <th className="p-3.5">姓名</th>
                                    <th className="p-3.5">電話</th>
                                    <th className="p-3.5">車種型號</th>
                                    <th className="p-3.5">最近里程</th>
                                    <th className="p-3.5">最近來店</th>
                                    <th className="p-3.5 text-center">維修履歷</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {filtered.map(c => (
                                    <tr key={c.id || c.plate} className="hover:bg-slate-50/80">
                                        <td className="p-3.5 font-mono font-black text-blue-700 text-sm">{c.plate}</td>
                                        <td className="p-3.5 font-bold text-slate-800">{c.name || '車主'}</td>
                                        <td className="p-3.5 font-mono text-slate-500">{c.phone || '-'}</td>
                                        <td className="p-3.5 text-slate-700">{c.bikeModel || '-'}</td>
                                        <td className="p-3.5 font-mono text-slate-600">{c.lastMileage ? `${c.lastMileage} km` : '-'}</td>
                                        <td className="p-3.5 text-slate-500">{formatDate(c.lastVisit)}</td>
                                        <td className="p-3.5 text-center">
                                            <button 
                                                onClick={() => setSelectedCustomer(c)} 
                                                className="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-lg font-bold flex items-center justify-center gap-1 mx-auto"
                                            >
                                                <History size={14}/> 查閱歷程
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {selectedCustomer && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-[9999] p-4">
                            <div className="bg-white w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
                                <div className="bg-slate-900 text-white p-4 flex justify-between items-center">
                                    <div className="font-bold flex items-center gap-2">
                                        <Bike size={20} className="text-blue-400"/>
                                        <span>{selectedCustomer.plate} - {selectedCustomer.name} 維修履歷</span>
                                    </div>
                                    <button onClick={() => setSelectedCustomer(null)} className="p-1 hover:bg-slate-800 rounded-lg"><X size={18}/></button>
                                </div>
                                <div className="p-5 overflow-y-auto flex-1 space-y-3">
                                    {records.filter(r => r.plate && String(r.plate).toUpperCase() === String(selectedCustomer.plate).toUpperCase()).map(r => (
                                        <div key={r.id} className="p-3.5 border border-slate-200 rounded-xl bg-slate-50 space-y-2">
                                            <div className="flex justify-between items-center border-b border-slate-200 pb-2">
                                                <span className="font-bold text-slate-700">{formatDate(r.date)} | 里程: {r.mileage || '-'} km</span>
                                                <span className="font-mono font-black text-blue-700">${Number(r.total || 0).toLocaleString()}</span>
                                            </div>
                                            <div className="space-y-1">
                                                {normalizeItems(r.items).map((it, i) => (
                                                    <div key={i} className="text-xs text-slate-600 flex justify-between">
                                                        <span>• {it.name} x{it.qty || 1}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const WorkforceView = ({ 
            records, staffList, shopInfo, staffProfiles, setStaffProfiles, 
            rolePresets, setRolePresets, seniorityRules, setSeniorityRules,
            isUnlocked, requestAdminAuth, showAlert, showConfirm,
            saveSettingsToCloud, isSavingSettings
        }) => {
            const currentYear = new Date().getFullYear();
            const currentMonth = new Date().getMonth();
            const [selectedYear, setSelectedYear] = useState(currentYear);
            const [selectedMonth, setSelectedMonth] = useState(currentMonth);

            // 職位分類標籤 ('all' | '店長' | '高階技師' | '技師' | '半技師' | '學徒')
            const [roleFilter, setRoleFilter] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');

            // 展開/收合全域職位抽成與年資加成設定面板
            const [showRulesConfig, setShowRulesConfig] = useState(false);
            const [tempRolePresets, setTempRolePresets] = useState(() => ({
                ...STAFF_ROLE_PRESETS,
                ...(rolePresets || {})
            }));
            const [tempSeniorityRules, setTempSeniorityRules] = useState(seniorityRules || DEFAULT_SENIORITY_RULES);

            // 編輯個別技師職級與薪酬彈窗狀態
            const [editingStaffName, setEditingStaffName] = useState(null);
            const [editForm, setEditForm] = useState({
                role: '技師',
                years: 1,
                baseSalary: 46000,
                laborBonusRate: 30,
                referralBonusRate: 25
            });
            const [appliedFeedback, setAppliedFeedback] = useState('');

            const activePresets = useMemo(() => ({
                ...STAFF_ROLE_PRESETS,
                ...(rolePresets || {})
            }), [rolePresets]);
            const activeSeniority = seniorityRules || DEFAULT_SENIORITY_RULES;

            // 計算年資加成率公式
            const getCalculatedRatesForRole = (roleName, yearsCount, customPresets = activePresets, customSeniority = activeSeniority) => {
                const preset = customPresets[roleName] || customPresets['技師'] || STAFF_ROLE_PRESETS['技師'];
                const y = Math.max(0, Number(yearsCount || 0));
                const laborBonusFromYears = Math.min(y * (customSeniority.laborRatePerYear || 1.0), customSeniority.maxLaborBonus || 12);
                const refBonusFromYears = Math.min(y * (customSeniority.referralRatePerYear || 0.5), customSeniority.maxReferralBonus || 6);

                const finalLaborRate = Math.round((preset.baseLaborRate + laborBonusFromYears) * 10) / 10;
                const finalRefRate = Math.round((preset.baseReferralRate + refBonusFromYears) * 10) / 10;

                return {
                    standardSalary: preset.defaultSalary,
                    standardLaborRate: finalLaborRate,
                    standardReferralRate: finalRefRate,
                    laborBonusFromYears,
                    refBonusFromYears,
                    preset
                };
            };

            // 取得技師完整設定檔（含自訂或自動退回標準）
            const getStaffProfile = (name) => {
                const profile = (staffProfiles && staffProfiles[name]) || DEFAULT_STAFF_PROFILES[name] || {};
                const role = profile.role || '技師';
                const years = Number(profile.years !== undefined ? profile.years : 1);
                const calculated = getCalculatedRatesForRole(role, years);

                const baseSalary = Number(profile.baseSalary !== undefined ? profile.baseSalary : calculated.standardSalary);
                const laborBonusRate = Number(profile.laborBonusRate !== undefined ? profile.laborBonusRate : calculated.standardLaborRate);
                const referralBonusRate = Number(profile.referralBonusRate !== undefined ? profile.referralBonusRate : calculated.standardReferralRate);

                return {
                    name,
                    role,
                    years,
                    baseSalary,
                    laborBonusRate,
                    referralBonusRate,
                    isCustomSalary: baseSalary !== calculated.standardSalary || laborBonusRate !== calculated.standardLaborRate || referralBonusRate !== calculated.standardReferralRate,
                    standardSalary: calculated.standardSalary,
                    standardLaborRate: calculated.standardLaborRate,
                    standardReferralRate: calculated.standardReferralRate,
                    preset: calculated.preset
                };
            };

            const staffStats = useMemo(() => {
                const stats = {};
                staffList.forEach(name => {
                    const prof = getStaffProfile(name);
                    stats[name] = { 
                        profile: prof,
                        tasks: 0, 
                        totalHours: 0, 
                        laborRevenue: 0, 
                        laborBonus: 0, 
                        referralCases: 0, 
                        referralRevenue: 0,
                        referralCommission: 0, 
                        baseSalary: prof.baseSalary,
                        totalSalary: prof.baseSalary 
                    };
                });

                records.filter(r => r.status === 'completed').forEach(r => {
                    const d = parseDateSafe(r.timestamp || r.date);
                    if (d.getFullYear() === selectedYear && d.getMonth() === selectedMonth) {
                        const items = normalizeItems(r.items);
                        const hourly = Number(r.hourlyRate || shopInfo.hourlyRate || 800);

                        items.forEach(it => {
                            const mechanics = Object.keys(it.mechanics || {}).filter(k => it.mechanics[k]);
                            if (mechanics.length > 0) {
                                const hours = evaluateMathExpression(it.laborHours, 0) * Number(it.qty || 1);
                                const rev = hours * hourly;
                                mechanics.forEach(m => {
                                    if (stats[m]) {
                                        const prof = stats[m].profile;
                                        const laborRateDecimal = (prof.laborBonusRate || 30) / 100;
                                        const allocatedRev = rev / mechanics.length;
                                        const allocatedHours = hours / mechanics.length;
                                        const allocatedBonus = allocatedRev * laborRateDecimal;

                                        stats[m].tasks += 1;
                                        stats[m].totalHours += allocatedHours;
                                        stats[m].laborRevenue += allocatedRev;
                                        stats[m].laborBonus += allocatedBonus;
                                    }
                                });
                            }
                        });

                        if (r.referrerStaff && stats[r.referrerStaff] && r.commissionParts) {
                            const prof = stats[r.referrerStaff].profile;
                            const eligibleParts = Number(r.eligiblePartsFee || 0);
                            const refRateDecimal = (prof.referralBonusRate || 25) / 100;
                            const refCommission = Math.round(eligibleParts * refRateDecimal);

                            stats[r.referrerStaff].referralCases += 1;
                            stats[r.referrerStaff].referralRevenue += eligibleParts;
                            stats[r.referrerStaff].referralCommission += refCommission;
                        }
                    }
                });

                Object.keys(stats).forEach(k => {
                    const s = stats[k];
                    s.laborBonus = Math.round(s.laborBonus);
                    s.totalBonus = Math.round(s.laborBonus + s.referralCommission);
                    s.totalSalary = Math.round(s.baseSalary + s.totalBonus);
                });

                return stats;
            }, [records, staffList, selectedYear, selectedMonth, shopInfo, staffProfiles, rolePresets, seniorityRules, activePresets]);

            // 依職位分類過濾名單
            const filteredStaffList = useMemo(() => {
                return staffList.filter(name => {
                    const prof = getStaffProfile(name);
                    if (roleFilter !== 'all' && prof.role !== roleFilter) return false;
                    if (searchTerm && !name.toUpperCase().includes(searchTerm.toUpperCase())) return false;
                    return true;
                });
            }, [staffList, roleFilter, searchTerm, staffProfiles, rolePresets, seniorityRules, activePresets]);

            // 各職位人數統計
            const roleCounts = useMemo(() => {
                const counts = { all: staffList.length, '店長': 0, '高階技師': 0, '技師': 0, '半技師': 0, '學徒': 0 };
                staffList.forEach(name => {
                    const p = getStaffProfile(name);
                    if (counts[p.role] !== undefined) counts[p.role] += 1;
                });
                return counts;
            }, [staffList, staffProfiles, rolePresets, seniorityRules, activePresets]);

            // 全店 / 分類彙總統計
            const aggregateStats = useMemo(() => {
                let totalBase = 0;
                let totalLaborBonus = 0;
                let totalRefCommission = 0;
                let grandTotalPayroll = 0;
                let totalHours = 0;
                let totalLaborRev = 0;

                filteredStaffList.forEach(name => {
                    const s = staffStats[name] || {};
                    totalBase += s.baseSalary || 0;
                    totalLaborBonus += s.laborBonus || 0;
                    totalRefCommission += s.referralCommission || 0;
                    grandTotalPayroll += s.totalSalary || 0;
                    totalHours += s.totalHours || 0;
                    totalLaborRev += s.laborRevenue || 0;
                });

                return {
                    totalBase,
                    totalLaborBonus,
                    totalRefCommission,
                    grandTotalPayroll,
                    totalHours,
                    totalLaborRev
                };
            }, [filteredStaffList, staffStats]);

            // 一鍵快速為某位技師套用其職位的標準薪酬與抽成（並自動同步雲端）
            const handleQuickApplyStandardSalary = (staffName, targetRole = null) => {
                const executeApply = () => {
                    const currentProf = getStaffProfile(staffName);
                    const finalRole = targetRole || currentProf.role;
                    const calculated = getCalculatedRatesForRole(finalRole, currentProf.years);

                    const updatedProfiles = {
                        ...(staffProfiles || {}),
                        [staffName]: {
                            role: finalRole,
                            years: currentProf.years,
                            baseSalary: calculated.standardSalary,
                            laborBonusRate: calculated.standardLaborRate,
                            referralBonusRate: calculated.standardReferralRate
                        }
                    };

                    setStaffProfiles(updatedProfiles);
                    if (saveSettingsToCloud) {
                        saveSettingsToCloud(null, true, null, updatedProfiles);
                    }
                    showAlert(`⚡ 已為「${staffName}」套用【${finalRole}】標準薪酬並同步雲端！\n\n• 基礎底薪：$${calculated.standardSalary.toLocaleString()}\n• 技術工資提撥：${calculated.standardLaborRate}% (含年資 ${currentProf.years} 年加成)\n• 零件業務抽成：${calculated.standardReferralRate}%`);
                };

                if (!isUnlocked && requestAdminAuth) {
                    requestAdminAuth(executeApply);
                } else {
                    executeApply();
                }
            };

            // 員工手動切換職位處理函式：直接切換並即時更新該職位之標準薪酬與年資提撥（自動同步雲端）
            const handleDirectChangeRole = (staffName, newRole) => {
                const currentProf = getStaffProfile(staffName);
                if (currentProf.role === newRole) return;
                
                const calculated = getCalculatedRatesForRole(newRole, currentProf.years);
                const updatedProfiles = {
                    ...(staffProfiles || {}),
                    [staffName]: {
                        ...((staffProfiles && staffProfiles[staffName]) || {}),
                        role: newRole,
                        years: currentProf.years,
                        baseSalary: calculated.standardSalary,
                        laborBonusRate: calculated.standardLaborRate,
                        referralBonusRate: calculated.standardReferralRate
                    }
                };

                setStaffProfiles(updatedProfiles);
                if (saveSettingsToCloud) {
                    saveSettingsToCloud(null, true, null, updatedProfiles);
                }
                showAlert(`✅ 員工「${staffName}」職位已設定為【${newRole}】並同步雲端！\n\n• 自動帶入底薪：$${calculated.standardSalary.toLocaleString()}\n• 技術工資提撥：${calculated.standardLaborRate}% (含年資 ${currentProf.years} 年加成)\n• 零件業務抽成：${calculated.standardReferralRate}%`);
            };

            // 一鍵將全體在冊員工依各自目前職位快速套用標準薪酬（並自動同步雲端）
            const handleApplyAllStaffStandardSalaries = () => {
                const executeBatch = () => {
                    if (showConfirm) {
                        showConfirm(`確定要將全店 ${staffList.length} 位同仁全部重新套用各自職位的最新標準薪酬與抽成率嗎？\n(手動調整過的底薪將重設為標準基準，並同步上傳雲端)`, () => {
                            const newProfiles = { ...(staffProfiles || {}) };
                            staffList.forEach(name => {
                                const currentProf = getStaffProfile(name);
                                const calculated = getCalculatedRatesForRole(currentProf.role, currentProf.years, tempRolePresets, tempSeniorityRules);
                                newProfiles[name] = {
                                    role: currentProf.role,
                                    years: currentProf.years,
                                    baseSalary: calculated.standardSalary,
                                    laborBonusRate: calculated.standardLaborRate,
                                    referralBonusRate: calculated.standardReferralRate
                                };
                            });
                            setStaffProfiles(newProfiles);
                            if (saveSettingsToCloud) {
                                saveSettingsToCloud(null, true, null, newProfiles, tempRolePresets, tempSeniorityRules);
                            }
                            showAlert(`🎉 全店 ${staffList.length} 位同仁已全數完成職位標準薪酬與抽成套用，雲端同步成功！`);
                        });
                    }
                };

                if (!isUnlocked && requestAdminAuth) {
                    requestAdminAuth(executeBatch);
                } else {
                    executeBatch();
                }
            };

            // 開啟個別調整彈窗
            const handleOpenEdit = (staffName) => {
                const executeOpen = () => {
                    const prof = getStaffProfile(staffName);
                    setEditingStaffName(staffName);
                    setEditForm({
                        role: prof.role,
                        years: prof.years,
                        baseSalary: prof.baseSalary,
                        laborBonusRate: prof.laborBonusRate,
                        referralBonusRate: prof.referralBonusRate
                    });
                    setAppliedFeedback('');
                };

                if (!isUnlocked && requestAdminAuth) {
                    requestAdminAuth(executeOpen);
                } else {
                    executeOpen();
                }
            };

            // 彈窗中：切換職級時可立即快速套用該職級薪酬
            const handleRoleSelectInModal = (newRole, autoApply = true) => {
                const calculated = getCalculatedRatesForRole(newRole, editForm.years);
                if (autoApply) {
                    setEditForm(prev => ({
                        ...prev,
                        role: newRole,
                        baseSalary: calculated.standardSalary,
                        laborBonusRate: calculated.standardLaborRate,
                        referralBonusRate: calculated.standardReferralRate
                    }));
                    setAppliedFeedback(`已快速套用【${newRole}】標準底薪 $${calculated.standardSalary.toLocaleString()} 與提撥 ${calculated.standardLaborRate}%！`);
                } else {
                    setEditForm(prev => ({ ...prev, role: newRole }));
                }
            };

            // 彈窗中：手動點擊「快速套用此職位標準薪酬」按鈕
            const handleApplyRoleDefaultInModal = () => {
                const calculated = getCalculatedRatesForRole(editForm.role, editForm.years);
                setEditForm(prev => ({
                    ...prev,
                    baseSalary: calculated.standardSalary,
                    laborBonusRate: calculated.standardLaborRate,
                    referralBonusRate: calculated.standardReferralRate
                }));
                setAppliedFeedback(`⚡ 已快速套用【${editForm.role}】標準底薪 $${calculated.standardSalary.toLocaleString()}、工資提撥 ${calculated.standardLaborRate}%、零件抽成 ${calculated.standardReferralRate}%！`);
            };

            // 儲存個別技師設定（並自動同步雲端）
            const handleSaveEdit = () => {
                if (!editingStaffName) return;
                const updatedProfiles = {
                    ...(staffProfiles || {}),
                    [editingStaffName]: {
                        role: editForm.role,
                        years: Math.max(0, Number(editForm.years) || 0),
                        baseSalary: Math.max(0, Number(editForm.baseSalary) || 0),
                        laborBonusRate: Math.max(0, Math.min(100, Number(editForm.laborBonusRate) || 0)),
                        referralBonusRate: Math.max(0, Math.min(100, Number(editForm.referralBonusRate) || 0))
                    }
                };

                setStaffProfiles(updatedProfiles);
                if (saveSettingsToCloud) {
                    saveSettingsToCloud(null, true, null, updatedProfiles);
                }
                setEditingStaffName(null);
                showAlert(`同仁「${editingStaffName}」職級與薪酬已儲存並同步至雲端！`);
            };

            // 儲存全域職位抽成與年資加成標準規則（並自動同步雲端）
            const handleSaveRulesConfig = () => {
                if (setRolePresets) setRolePresets(tempRolePresets);
                if (setSeniorityRules) setSeniorityRules(tempSeniorityRules);
                if (saveSettingsToCloud) {
                    saveSettingsToCloud(null, true, null, null, tempRolePresets, tempSeniorityRules);
                }
                setShowRulesConfig(false);
                showAlert('🎉 全店職位薪酬標準與年資加成規則已更新，並成功備份至雲端！');
            };

            // 還原出廠職位與加成標準
            const handleResetRulesToDefault = () => {
                setTempRolePresets(STAFF_ROLE_PRESETS);
                setTempSeniorityRules(DEFAULT_SENIORITY_RULES);
                showAlert('已載入系統出廠預設標準，點擊儲存後即可套用。');
            };

            const roleOrder = ['店長', '高階技師', '技師', '半技師', '學徒'];

            return (
                <div className="w-full max-w-7xl mx-auto space-y-4 pb-24 text-xs overflow-x-hidden">
                    {/* 頂部標題與月份切換 */}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5 bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <div>
                            <div className="flex items-center gap-2">
                                <Briefcase className="text-blue-600" size={20}/>
                                <h2 className="text-base sm:text-lg font-black text-slate-800">
                                    同仁績效、職位年資薪酬管理中心
                                </h2>
                            </div>
                            <p className="text-slate-400 text-[11px] mt-0.5">
                                五階職位架構體系，年資動態加成引擎，資料即時與 Google Apps Script 雲端同步
                            </p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                                <select 
                                    value={selectedYear} 
                                    onChange={e => setSelectedYear(Number(e.target.value))} 
                                    className="p-1 border-none bg-transparent font-bold text-xs text-slate-700 outline-none cursor-pointer"
                                >
                                    {[2024, 2025, 2026, 2027].map(y => <option key={y} value={y}>{y} 年</option>)}
                                </select>
                                <select 
                                    value={selectedMonth} 
                                    onChange={e => setSelectedMonth(Number(e.target.value))} 
                                    className="p-1 border-none bg-transparent font-bold text-xs text-slate-700 outline-none cursor-pointer"
                                >
                                    {Array.from({length: 12}).map((_, i) => <option key={i} value={i}>{i + 1} 月</option>)}
                                </select>
                            </div>

                            <button 
                                type="button" 
                                onClick={() => setShowRulesConfig(!showRulesConfig)}
                                className={`px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition-all text-xs ${
                                    showRulesConfig 
                                        ? 'bg-blue-600 text-white shadow-xs' 
                                        : 'bg-white border border-slate-300 hover:bg-slate-50 text-slate-700'
                                }`}
                            >
                                <Settings size={14}/>
                                <span>{showRulesConfig ? '收合標準' : '⚙️ 調整五階標準'}</span>
                            </button>
                        </div>
                    </div>

                    {/* 職位標準薪資與抽成加成自訂面板 (Collapsible Config Panel) */}
                    {showRulesConfig && (
                        <div className="bg-slate-900 text-white p-3.5 sm:p-5 rounded-2xl shadow-xl border border-slate-700 space-y-3.5 animate-in fade-in zoom-in-95">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-800 pb-2.5">
                                <div>
                                    <h3 className="text-xs sm:text-sm font-black text-white flex items-center gap-1.5">
                                        <Coins size={16} className="text-amber-400"/>
                                        <span>五階職位標準底薪、基準提撥率與年資加成設定</span>
                                    </h3>
                                    <p className="text-[10px] sm:text-[11px] text-slate-400 mt-0.5">
                                        設定後自動存至雲端，可隨時為單一員工或全體同仁一鍵帶入
                                    </p>
                                </div>
                                <div className="flex gap-2 w-full sm:w-auto">
                                    <button 
                                        type="button" 
                                        onClick={handleResetRulesToDefault}
                                        className="flex-1 sm:flex-none px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-bold rounded-lg transition-colors"
                                    >
                                        還原預設
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={handleApplyAllStaffStandardSalaries}
                                        className="flex-1 sm:flex-none px-3 py-1.5 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-slate-950 font-black text-[11px] rounded-lg shadow-sm flex items-center justify-center gap-1 transition-all"
                                    >
                                        <Sparkle size={13}/> ⚡ 全體套用此標準
                                    </button>
                                </div>
                            </div>

                            {/* 五個職位的標準薪資設定卡 */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
                                {roleOrder.map(rKey => {
                                    const rData = tempRolePresets[rKey] || STAFF_ROLE_PRESETS[rKey];
                                    const headerClass = rData.headerClass || 'border-slate-700 bg-slate-800/40 text-slate-200';

                                    return (
                                        <div key={rKey} className={`p-2.5 rounded-xl border ${headerClass} space-y-2 flex flex-col justify-between`}>
                                            <div>
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="font-black text-xs flex items-center gap-1">
                                                        {rKey === '店長' && <Crown size={12} className="text-rose-400" />}
                                                        {rKey === '高階技師' && <Medal size={12} className="text-amber-400" />}
                                                        <span>{rKey}</span>
                                                    </span>
                                                </div>
                                                <div className="text-[10px] text-slate-400 leading-tight line-clamp-2 h-6 mb-1.5">
                                                    {rData.desc}
                                                </div>

                                                <div className="space-y-1.5">
                                                    <div>
                                                        <label className="text-[9px] text-slate-400 block font-bold">標準底薪 ($)</label>
                                                        <div className="flex items-center gap-1 bg-slate-800/90 p-1 rounded-lg border border-slate-700">
                                                            <span className="text-slate-400 font-bold">$</span>
                                                            <input 
                                                                type="number" 
                                                                step="1000"
                                                                value={rData.defaultSalary}
                                                                onChange={e => setTempRolePresets({
                                                                    ...tempRolePresets,
                                                                    [rKey]: { ...rData, defaultSalary: Number(e.target.value) }
                                                                })}
                                                                className="w-full bg-transparent font-mono font-black text-right text-white outline-none text-xs"
                                                            />
                                                        </div>
                                                    </div>

                                                    <div className="grid grid-cols-2 gap-1">
                                                        <div>
                                                            <label className="text-[9px] text-slate-400 block font-bold truncate">工資提撥</label>
                                                            <div className="flex items-center gap-0.5 bg-slate-800/90 p-1 rounded-lg border border-slate-700">
                                                                <input 
                                                                    type="number" 
                                                                    min="0"
                                                                    max="100"
                                                                    value={rData.baseLaborRate}
                                                                    onChange={e => setTempRolePresets({
                                                                        ...tempRolePresets,
                                                                        [rKey]: { ...rData, baseLaborRate: Number(e.target.value) }
                                                                    })}
                                                                    className="w-full bg-transparent font-mono font-black text-right text-emerald-400 outline-none text-xs"
                                                                />
                                                                <span className="text-slate-400 text-[10px]">%</span>
                                                            </div>
                                                        </div>

                                                        <div>
                                                            <label className="text-[9px] text-slate-400 block font-bold truncate">零件抽成</label>

        const CashierView = ({ records, cashRecords, setCashRecords, showAlert, showConfirm, saveSettingsToCloud, isCloudEnabled, isSavingSettings }) => {
            const todayStr = getLocalDateString(new Date());
            const [targetDate, setTargetDate] = useState(todayStr);

            const [startingCash, setStartingCash] = useState('');
            const [incomes, setIncomes] = useState([]);
            const [incDesc, setIncDesc] = useState('');
            const [incAmount, setIncAmount] = useState('');

            const [expenses, setExpenses] = useState([]);
            const [expDesc, setExpDesc] = useState('');
            const [expAmount, setExpAmount] = useState('');

            const [showCalculator, setShowCalculator] = useState(false);
            const [denoms, setDenoms] = useState({ 1000: '', 500: '', 100: '', 50: '', 10: '', 5: '', 1: '' });
            const [manualActualCash, setManualActualCash] = useState('');
            const [note, setNote] = useState('');
            const [isClosed, setIsClosed] = useState(false);

            const { cashFromOrders, transferTotal } = useMemo(() => {
                let cash = 0;
                let trans = 0;
                records.forEach(r => {
                    const rDate = getLocalDateString(parseDateSafe(r.timestamp || r.date));
                    if (rDate === targetDate && r.status === 'completed') {
                        if (r.paymentMethod === '現金') cash += Number(r.total || 0);
                        else if (r.paymentMethod === '匯款') trans += Number(r.total || 0);
                    }
                });
                return { cashFromOrders: cash, transferTotal: trans };
            }, [records, targetDate]);

            useEffect(() => {
                const saved = cashRecords.find(c => c.date === targetDate);
                if (saved) {
                    setStartingCash(saved.startingCash || '');
                    setIncomes(saved.incomes || []);
                    setExpenses(saved.expenses || []);
                    setNote(saved.note || '');
                    setIsClosed(saved.isClosed || false);
                    if (saved.denoms) {
                        setDenoms(saved.denoms);
                        setShowCalculator(true);
                    } else {
                        setManualActualCash(saved.actual !== undefined ? saved.actual : '');
                        setShowCalculator(false);
                    }
                } else {
                    setStartingCash('');
                    setIncomes([]);
                    setExpenses([]);
                    setNote('');
                    setIsClosed(false);
                    setManualActualCash('');
                    setShowCalculator(false);
                }
            }, [targetDate, cashRecords]);

            const addIncome = () => {
                if (!incDesc || !incAmount) return;
                setIncomes([...incomes, { id: Date.now(), desc: incDesc, amount: Number(incAmount) }]);
                setIncDesc(''); setIncAmount('');
            };

            const addExpense = () => {
                if (!expDesc || !expAmount) return;
                setExpenses([...expenses, { id: Date.now(), desc: expDesc, amount: Number(expAmount) }]);
                setExpDesc(''); setExpAmount('');
            };

            const totalIncomes = incomes.reduce((sum, i) => sum + i.amount, 0);
            const totalExpenses = expenses.reduce((sum, e) => sum + e.amount, 0);
            const expectedCash = Number(startingCash || 0) + cashFromOrders + totalIncomes - totalExpenses;

            const calculatedActualCash = showCalculator 
                ? Object.entries(denoms).reduce((sum, [val, cnt]) => sum + (Number(val) * Number(cnt || 0)), 0)
                : Number(manualActualCash || 0);

            const diff = calculatedActualCash - expectedCash;

            const handleSave = (closeAccount) => {
                const newRec = {
                    id: targetDate,
                    date: targetDate,
                    startingCash: Number(startingCash || 0),
                    incomes,
                    expenses,
                    cashFromOrders,
                    expected: expectedCash,
                    actual: calculatedActualCash,
                    denoms: showCalculator ? denoms : null,
                    diff,
                    note,
                    transfer: transferTotal,
                    isClosed: closeAccount,
                    timestamp: new Date().toISOString()
                };

                const updated = [newRec, ...cashRecords.filter(c => c.date !== targetDate)];
                setCashRecords(updated);
                setIsClosed(closeAccount);
                if (saveSettingsToCloud) saveSettingsToCloud(updated, true);
                showAlert(closeAccount ? `【${targetDate}】 帳務已確認關帳鎖定！` : `【${targetDate}】 對帳草稿已儲存！`);

                                <Coins className="text-blue-600" size={17}/> 系統應有現金計算

                                <div className="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                    <span className="font-bold text-slate-600">① 找零準備金 (+)</span>

                                    />
                                </div>
                                <div className="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                    <span className="font-bold text-slate-600">② 當日工單現金收入 (+)</span>
                                    <span className="font-mono font-black text-blue-700 text-sm">${cashFromOrders.toLocaleString()}</span>
                                </div>
                                <div className="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                    <span className="font-bold text-slate-600">③ 手工額外現金收入 (+)</span>
                                    <span className="font-mono font-black text-emerald-600 text-sm">+${totalIncomes.toLocaleString()}</span>
                                </div>
                                <div className="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                    <span className="font-bold text-slate-600">④ 公庫現金支出開銷 (-)</span>

                                </div>
                                <div className="flex justify-between items-center bg-slate-900 text-white p-3 rounded-xl shadow-xs">

                            <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                                <h3 className="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                                    <Calculator className="text-emerald-600" size={17}/> 實際現金盤點

                                    {showCalculator ? '切換為直接輸入金額' : '使用幣值盤點器'}
                                </button>
                            </div>

                            {showCalculator ? (
                                <div className="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200">

                                            <span className="w-10 text-right font-mono font-bold text-slate-500">${val}</span>
                                            <span className="text-slate-300">x</span>
                                            <input 
                                                type="number" 
                                                min="0" 
                                                value={denoms[val] || ''} 
                                                onChange={e => setDenoms({...denoms, [val]: e.target.value})} 
                                                className="w-full p-1 text-center font-mono font-bold outline-none"

                                    <input 
                                        type="number" 
                                        value={manualActualCash}

                    quickServices,
                    staffList,
                    customers,
                    records,
                    cashRecords,
                    adminPin: currentPin

                const a = document.createElement('a');
                a.href = url;
                a.download = `SourceMoto_Backup_${getLocalDateString(new Date())}.json`;

                a.click();

                reader.onload = (event) => {

                        if (!parsed || typeof parsed !== 'object') {
                            throw new Error('檔案格式不正確');

                            if (parsed.shopInfo) setShopInfo(parsed.shopInfo);
                            if (Array.isArray(parsed.quickServices)) setQuickServices(parsed.quickServices);
                            if (Array.isArray(parsed.staffList)) setStaffList(parsed.staffList);
                            if (Array.isArray(parsed.customers)) setCustomers(parsed.customers);
                            if (Array.isArray(parsed.records)) setRecords(parsed.records);
                            if (Array.isArray(parsed.cashRecords)) setCashRecords(parsed.cashRecords);
